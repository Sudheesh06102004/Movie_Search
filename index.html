<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Movie Search</h1>
        <div class="search-box">
            <input type="text" placeholder="Search movies...">
            <button>Search</button>
        </div>
        <ul>
            <li><a href="#" onClick="event.preventDefault(); showpage('home')">Home</a></li>
            <li><a href="#" onClick="event.preventDefault(); showpage('movies')">Movies</a></li>
            <li><a href="#" onClick="event.preventDefault(); showpage('watchlist')">Watchlist</a></li>
        </ul>
    </header>

    <main>
        <section id="home">
            <h1>Welcome to Movie Search</h1>
        </section>

        <section id="movies" style="display: none;">
            <h1>Movies</h1>
        </section>

        <section id="watchlist" style="display: none;">
            <h1>Watchlist</h1>
            <p>Your saved movies will appear here.</p>
            <div id="watchlist-container">
                <!-- Watchlist items will be dynamically added here -->

            </div>
        </section>

    </main>

    <footer>

    </footer>
</body>
<script src="script.js"></script>
</html>
